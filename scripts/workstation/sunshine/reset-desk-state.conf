[Service]
# On every Sunshine start no client is connected, so restore the desk state.
# Covers streams that ended without undo (Sunshine crash, reboot mid-stream).
# Leading "-": a failure here must never block Sunshine from starting.
ExecStartPre=-%h/.local/bin/sunshine-display-mode desk
ExecStartPre=-%h/.local/bin/mangohud-fps-mode desk
